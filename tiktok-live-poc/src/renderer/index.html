<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TikTok Live Monitor PoC</title>
    <style>
      :root { --bg:#0f1419; --panel:#1a2029; --panel2:#222b36; --line:#2c3744; --txt:#e6edf3; --dim:#8b98a5; --accent:#22d3ee; --green:#16a34a; --red:#ef4444; --amber:#f59e0b; }
      * { box-sizing: border-box; }
      body { font: 13px/1.4 system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: #0b0f14; border-bottom: 1px solid var(--line); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
      .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
      header .sp { margin-left: auto; color: var(--dim); }
      header b { color: var(--txt); }
      #session { padding: 4px 14px; background: #11161d; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
      .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 12px 14px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
      .card .lbl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      .card .val { font-size: 26px; font-weight: 700; margin-top: 2px; }
      .card.alert .val { color: var(--red); }
      main { flex: 1; display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; padding: 0 14px 14px; min-height: 0; }
      .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
      .panel > h3 { margin: 0; padding: 9px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
      .panel > .body { overflow: auto; padding: 4px 0; }
      .feed-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
      .feed-row.failed { background: rgba(239,68,68,.08); }
      .avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--panel2); flex: none; }
      .who { min-width: 0; flex: 1; }
      .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who .item { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .price { font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
      .price.failed { color: var(--red); text-decoration: line-through; }
      .time { color: var(--dim); font-size: 11px; width: 56px; text-align: right; flex: none; }
      .badge { font-size: 10px; background: var(--red); color: #fff; border-radius: 4px; padding: 1px 5px; }
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: left; padding: 5px 12px; border-bottom: 1px solid var(--line); }
      th { color: var(--dim); font-weight: 600; font-size: 11px; }
      td.n, th.n { text-align: right; }
      .auction { padding: 10px 12px; }
      .auction .pname { font-weight: 600; margin-bottom: 6px; }
      .auction .bid { font-size: 22px; font-weight: 700; color: var(--accent); }
      .auction .meta { color: var(--dim); font-size: 12px; }
      .rank { color: var(--dim); width: 18px; text-align: right; }
      .empty { color: var(--dim); padding: 14px 12px; font-style: italic; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <b id="status">connecting…</b>
      <span class="sp">room <b id="room">—</b> · viewers <b id="viewers">—</b></span>
    </header>
    <div id="session">—</div>
    <div class="cards">
      <div class="card"><div class="lbl">Items Sold</div><div class="val" id="itemsSold">0</div></div>
      <div class="card"><div class="lbl">GMV</div><div class="val" id="gmv">$0.00</div></div>
      <div class="card"><div class="lbl">Unique Buyers</div><div class="val" id="uniqueBuyers">0</div></div>
      <div class="card"><div class="lbl">Top Bid</div><div class="val" id="topBid">—</div></div>
      <div class="card alert"><div class="lbl">Failed Payments</div><div class="val" id="failed">0</div></div>
    </div>
    <main>
      <div class="col">
        <div class="panel" style="flex:1">
          <h3><span>Live Sales Feed</span><span id="feedCount" class="sp"></span></h3>
          <div class="body" id="feed"><div class="empty">Waiting for sales… (open the live/auction view in the monitor window)</div></div>
        </div>
      </div>
      <div class="col">
        <div class="panel">
          <h3>Current Auction</h3>
          <div class="auction" id="currentAuction"><div class="empty">No active auction</div></div>
        </div>
        <div class="panel" style="flex:1">
          <h3>Top Buyers</h3>
          <div class="body"><table><tbody id="topBuyers"></tbody></table></div>
        </div>
        <div class="panel" style="flex:1">
          <h3>Products</h3>
          <div class="body"><table>
            <thead><tr><th>Product</th><th class="n">Sold</th><th class="n">Failed</th></tr></thead>
            <tbody id="products"></tbody>
          </table></div>
        </div>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
